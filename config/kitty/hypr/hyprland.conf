########################################################################################
# THEME CONFIGURATION
# Define these variables once to ensure consistency across your system.
########################################################################################

$background = rgb(1e1e2e)
$foreground = rgb(cdd6f4)
$primary    = rgb(89b4fa)   # Blue-ish accent
$secondary  = rgb(f5c2e7)   # Pink-ish accent
$alert      = rgb(f38ba8)   # Red
$inactive   = rgb(6c7086)   # Muted grey for inactive borders

########################################################################################
# MONITORS
########################################################################################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto


########################################################################################
# EXEC ONCE
# Autostart essential processes
########################################################################################

# Status bar
exec-once = waybar

# Wallpaper manager
exec-once = hyprpaper

# Authentication agent (Polkit)
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store


########################################################################################
# ENVIRONMENT VARIABLES
# Force Wayland for various toolkits
########################################################################################

env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher


########################################################################################
# INPUT
########################################################################################

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}


########################################################################################
# GENERAL
# Layout and Border settings
########################################################################################

general {
    # Gaps and Borders
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Colors (Referencing variables defined at the top)
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $inactive

    # Layout
    layout = dwindle
    
    # Tearing
    allow_tearing = false
}


########################################################################################
# DECORATION
# Visual effects like Blur and Shadows
########################################################################################

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.9

    # Blur settings
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    # Shadow settings
    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}


########################################################################################
# LAYOUTS
########################################################################################

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
    pseudotile = yes 
    preserve_split = yes 
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/
    new_is_master = true
}


########################################################################################
# MISC
########################################################################################

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
}


########################################################################################
# WINDOW RULES
########################################################################################

# Example window rules
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Floating Dialogs
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(nm-connection-editor)$

# Opacity rules (Make terminals slightly transparent)
windowrulev2 = opacity 0.9 0.9,class:^(kitty)$
windowrulev2 = opacity 0.9 0.9,class:^(Alacritty)$