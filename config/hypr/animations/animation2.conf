########################################################################################
# ANIMATIONS
########################################################################################

animations {
    enabled = yes

    # Faster, smoother animations
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 3, decel, popin 60%
    animation = windowsIn, 1, 3, decel, popin 60%
    animation = windowsOut, 1, 3, decel, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, decel, slide
}

