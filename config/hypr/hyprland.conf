########################################################################################
# THEME CONFIGURATION
# Define these variables once to ensure consistency across your system.
########################################################################################

$background = rgb(1e1e2e)
$foreground = rgb(cdd6f4)
$primary    = rgb(89b4fa)   # Blue-ish accent
$secondary  = rgb(f5c2e7)   # Pink-ish accent
$alert      = rgb(f38ba8)   # Red
$inactive   = rgb(6c7086)   # Muted grey for inactive borders

########################################################################################
# GLOBAL VARIABLES
########################################################################################

$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

########################################################################################
# SOURCE CONFIGS
########################################################################################

source = ~/.config/hypr/display.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf

########################################################################################
# EXEC ONCE
# Autostart essential processes
########################################################################################

# Status bar
exec-once = waybar

# Wallpaper manager
exec-once = hyprpaper

# Authentication agent (Polkit)
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store


